name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Icarus Verilog and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q -p no:cacheprovider

      - name: Verify repository and real-tool smoke run
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verify_repository.py --require-tools --smoke

      - name: Verify public-release manifest and checksums
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/generate_checksums.py
          python scripts/verify_repository.py --public-release
